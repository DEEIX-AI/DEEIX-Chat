name: deeix-chat

services:
  app:
    image: ${DEEIX_CHAT_IMAGE:-ghcr.io/deeix-ai/deeix-chat:latest}
    container_name: deeix-chat-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vocechat:
        condition: service_healthy
      vocechat-init:
        condition: service_completed_successfully
    environment:
      # Full compose connects to bundled services on the compose network.
      # These environment variables override database and Redis values in config.yaml.
      POSTGRES_DSN: "postgres://deeix_chat:deeix_chat_2026@postgres:5432/deeix_chat?sslmode=disable&TimeZone=Asia/Shanghai"
      REDIS_ADDR: "redis:6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: "deeix_chat_2026"
      INTERNAL_MESSAGING_ENABLED: "true"
      INTERNAL_MESSAGING_VOCECHAT_URL: "http://vocechat:3000"
      INTERNAL_MESSAGING_SECRET_FILE: "/run/secrets/vocechat/third-party-secret"
    ports:
      # Optional. Localhost-only by default. Put a reverse proxy in front for public access.
      - "127.0.0.1:8080:8080"
    volumes:
      - app_storage:/app/storage
      - app_data:/app/data
      - vocechat_secrets:/run/secrets/vocechat:ro
      # The image runs from /app and reads /app/config.yaml automatically.
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - deeix-chat

  postgres:
    image: pgvector/pgvector:pg16
    container_name: deeix-chat-postgres
    environment:
      POSTGRES_USER: deeix_chat
      POSTGRES_PASSWORD: deeix_chat_2026
      POSTGRES_DB: deeix_chat
    ports:
      # Optional. Localhost-only for local administration; the app uses the internal Docker network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deeix-chat

  redis:
    image: redis:7
    container_name: deeix-chat-redis
    command: redis-server --requirepass deeix_chat_2026
    ports:
      # Optional. Localhost-only for local administration; the app uses the internal Docker network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "deeix_chat_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deeix-chat

  vocechat:
    # The bundle contains the validated VoceChat server and DEEIX integration files.
    image: deeix-chat-vocechat:v0.5.32
    build:
      context: ./docker/vocechat
      dockerfile: Dockerfile
      args:
        VOCECHAT_BASE_IMAGE: privoce/vocechat-server:v0.5.32
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - vocechat_data:/home/vocechat-server/data
    command:
      - --network.bind
      - 0.0.0.0:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - deeix-chat

  vocechat-init:
    image: deeix-chat-vocechat:v0.5.32
    restart: "no"
    depends_on:
      vocechat:
        condition: service_healthy
    entrypoint:
      - python3
      - /opt/deeix/vocechat-init.py
    environment:
      VOCECHAT_URL: "http://vocechat:3000"
      VOCECHAT_SECRET_PATH: "/run/secrets/vocechat/third-party-secret"
      VOCECHAT_CREDENTIAL_PATH: "/var/lib/deeix-vocechat-init/administrator.json"
    volumes:
      - vocechat_secrets:/run/secrets/vocechat
      - vocechat_init_state:/var/lib/deeix-vocechat-init
    networks:
      - deeix-chat

volumes:
  app_storage:
    name: deeix-chat-app-storage
  app_data:
    name: deeix-chat-app-data
  postgres_data:
    name: deeix-chat-postgres-data
  redis_data:
    name: deeix-chat-redis-data
  vocechat_data:
    name: deeix-chat-vocechat-data
  vocechat_secrets:
    name: deeix-chat-vocechat-secrets
  vocechat_init_state:
    name: deeix-chat-vocechat-init-state

networks:
  deeix-chat:
    name: deeix-chat-network
