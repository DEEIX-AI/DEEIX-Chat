name: Desktop Release

# Coordinate shared inputs, native builds and publication in the source ref's
# context. Tag code must never write caches in the default branch's scope.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to dispatch; leave empty to build the selected ref"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch release on its tag
    if: inputs.release_tag != '' && github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh workflow run desktop-release.yml --ref "refs/tags/$RELEASE_TAG"
          echo "Release $RELEASE_TAG dispatched in its tag context." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Prepare shared inputs
    if: inputs.release_tag == '' || github.ref_type == 'tag'
    uses: ./.github/workflows/desktop-prepare.yml
    with:
      release-tag: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

  macos-arm64:
    name: macOS arm64
    needs: prepare
    uses: ./.github/workflows/desktop-macos.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
      arch: arm64
    secrets: inherit

  macos-x64:
    name: macOS x64
    needs: prepare
    uses: ./.github/workflows/desktop-macos.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
      arch: x64
    secrets: inherit

  linux-x64:
    name: Linux x64
    needs: prepare
    uses: ./.github/workflows/desktop-linux.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
    secrets: inherit

  windows-x64:
    name: Windows x64
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop-windows.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
    secrets: inherit

  publish:
    name: Assemble draft release
    needs: [prepare, macos-arm64, macos-x64, linux-x64, windows-x64]
    if: needs.prepare.outputs.release-tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verify publication source
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: node apps/desktop/scripts/desktop-source.mjs
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Download verified release assets
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true
      # One writer creates the draft, latest.json and SHA256SUMS only after all
      # four targets pass verification. Publishing the draft remains a human step.
      - name: Upload assets and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: node apps/desktop/scripts/publish-desktop-release.mjs --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --dir release-assets
      - name: Refresh beta manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: bash apps/desktop/scripts/refresh-beta-manifest.sh "$RELEASE_TAG"
