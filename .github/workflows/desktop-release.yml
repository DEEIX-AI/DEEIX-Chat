name: Desktop Release

# Builds and publishes the Tauri desktop app for macOS, Windows and Linux.
#
# Repository secrets:
#
#   Updater (required — the build fails without them)
#     TAURI_SIGNING_PRIVATE_KEY           output of `tauri signer generate`
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if none)
#
#   macOS signing + notarization (optional; unsigned builds when absent)
#     APPLE_CERTIFICATE                   base64 of the Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD          .p12 password
#     APPLE_ID                            Apple ID used for notarization
#     APPLE_PASSWORD                      app-specific password for that Apple ID
#   (signing identity and team id are read from the certificate)
#
#   Windows code signing (optional; unsigned builds when absent)
#     WINDOWS_CERTIFICATE                 base64 of the code-signing .pfx
#     WINDOWS_CERTIFICATE_PASSWORD        .pfx password
#
# Repository variables (optional):
#     WEBVIEW2_FIXED_RUNTIME_URL          x64 WebView2 Fixed Version .cab from
#                                         Microsoft; when set, the Windows leg also
#                                         builds the -portable-offline.zip
#     WEBVIEW2_FIXED_RUNTIME_SHA256       expected SHA-256 of that .cab (pinning)
#
# Signing switches on by itself once the secrets exist. Without them the
# installers are unsigned: macOS users must allow the app under
# System Settings → Privacy & Security, Windows shows a SmartScreen prompt.
#
# Windows ships three forms from one set of binaries: the per-user NSIS setup
# (auto-updates), the per-machine MSI for IT (no in-app updates; its
# upgradeCode in tauri.conf.json must never change) and a portable zip
# (scripts/package-portable.mjs). Every release also gets SHA256SUMS, and the
# Windows files get GitHub build provenance (`gh attestation verify`).

# Release channels are decided by the tag:
#   v1.2.3          stable  → normal release; the app polls releases/latest/download/latest.json
#   v1.2.3-beta.1   beta    → prerelease; the app polls releases/download/desktop-beta/latest.json,
#                             which desktop-channel.yml refreshes when a prerelease is published.
# Both channels are signed with the same updater key: a channel is a distribution
# lane, not a trust boundary. A beta build only differs in the endpoint it polls.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  # Manual runs build every target and upload the installers as workflow
  # artifacts; only tag pushes create a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macOS
            runner: macos-14
            args: "--target aarch64-apple-darwin"
          - label: macOS x64
            platform: macOS
            runner: macos-14
            args: "--target x86_64-apple-darwin"
          - label: Linux x64
            platform: Linux
            runner: ubuntu-24.04
            args: ""
          - label: Windows x64
            platform: Windows
            runner: windows-2022
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Windows needs a C compiler for cgo; fail early with a clear message
      # rather than inside the Go build.
      - name: Check C compiler
        shell: bash
        run: gcc --version | head -1 || { echo "::error::no C compiler for cgo"; exit 1; }

      # The Go server ships inside the app as a sidecar (local mode). It links
      # SQLite through cgo, so it is built natively on each matrix leg; macOS
      # x86_64 is cross-built from the arm64 runner with Apple's toolchain.
      - name: Build server sidecar
        shell: bash
        run: |
          target="${{ matrix.args }}"
          target="${target#--target }"
          if [[ -n "$target" ]]; then
            node apps/desktop/scripts/build-sidecar.mjs --target "$target"
          else
            node apps/desktop/scripts/build-sidecar.mjs
          fi

      # Version drift between VERSION, package.json, tauri.conf.json and
      # Cargo.toml must fail the release rather than ship a mislabelled build.
      - name: Verify version consistency
        run: node scripts/sync-version.mjs --check

      # Tauri treats a signing variable that merely exists as configured, so
      # the Apple credentials are exported only when the secrets are set;
      # identity and team id are then read from the certificate.
      - name: Configure Apple signing
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_ID" || -z "$APPLE_PASSWORD" ]]; then
            # Ad-hoc: Tauri skips codesign without an identity, and the linker's
            # own signature is not a valid bundle signature ("damaged" on macOS).
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::APPLE_* secrets not set; the macOS app is ad-hoc signed and not notarized"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD; do
            printf '%s<<__EOF__\n%s\n__EOF__\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          bash apps/desktop/scripts/apple-signing-env.sh >> "$GITHUB_ENV"

      # Tauri signs Windows binaries with a certificate from the user store,
      # selected by thumbprint. tauri-cli only reads it from
      # bundle.windows.certificateThumbprint (no environment variable), so the
      # next step passes it with --config.
      - name: Import Windows code-signing certificate
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "::warning::WINDOWS_CERTIFICATE not set; building an unsigned Windows installer"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx
          # A thumbprint is a public hash of the certificate, not a secret.
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Build-time config (scripts/release-config.mjs): the beta updater
      # endpoint, the MSI's numeric ProductVersion and the signing thumbprint.
      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [[ "$tag" == *-* ]]; then channel=beta; else channel=stable; fi
          echo "name=$channel" >> "$GITHUB_OUTPUT"
          args=(--channel "$channel" --repository "${{ github.repository }}")
          if [[ -n "${WINDOWS_CERTIFICATE_THUMBPRINT:-}" ]]; then
            args+=(--thumbprint "$WINDOWS_CERTIFICATE_THUMBPRINT")
          fi
          # One `--config <json>` without spaces: tauri-action splits `args` on whitespace.
          echo "tauri_args=$(node apps/desktop/scripts/release-config.mjs "${args[@]}")" >> "$GITHUB_OUTPUT"

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # APPLE_* and the Windows certificate thumbprint arrive through
          # GITHUB_ENV from the steps above, only when configured.
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Beta endpoint, MSI version and signing thumbprint; see the channel step.
          args: ${{ matrix.args }} ${{ steps.channel.outputs.tauri_args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "v__VERSION__"
          # Asset suffixes as produced by the assets job below. The Verified and
          # Available columns are edited by hand on the draft when a platform
          # needs a caveat.
          releaseBody: |
            ### ⏬ Download

            | Platform | Download | Verified | Available |
            | --- | --- | --- | --- |
            | macOS · Apple silicon | `macos-arm64.dmg` | ✅ Verified | ✅ Available |
            | macOS · Intel | `macos-x64.dmg` | ✅ Verified | ✅ Available |
            | Linux · x86_64 | `linux-x64.AppImage` or `.deb` | ✅ Verified | ✅ Available |
            | Windows · x86_64 | `windows-x64-setup.exe` | ✅ Verified | ✅ Available |
            | Windows · x86_64 · MSI | `windows-x64.msi` | ✅ Verified | ✅ Available |
            | Windows · x86_64 · Portable | `windows-x64-portable.zip` | ✅ Verified | ✅ Available |

            Checksums are in `SHA256SUMS`. `-updater.tar.gz`, `.sig` and `latest.json` belong to the built-in updater.
          # Draft until a human publishes it. Stable installs poll GitHub's
          # releases/latest URL (newest published non-prerelease); beta installs
          # poll the desktop-beta rolling manifest, refreshed on publish by
          # desktop-channel.yml. Publishing the draft is the act that ships.
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.name == 'beta' }}
          includeUpdaterJson: true
          # With both NSIS and MSI built, point the generic `windows-x86_64`
          # entry at the per-user installer (the auto-updating form). Installed
          # apps look up `windows-x86_64-nsis` / `-msi` first by bundle type.
          updaterJsonPreferNsis: true

      # Same post-processing as a local build (scripts/package-dmg.sh); the
      # re-encoded image replaces the asset tauri-action uploaded.
      - name: Package DMG
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in apps/desktop/src-tauri/target/*/release/bundle/dmg/*.dmg apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            bash apps/desktop/scripts/package-dmg.sh "$dmg"
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              gh release upload "${{ github.ref_name }}" "$dmg" --clobber --repo "${{ github.repository }}"
            fi
          done

      - name: Verify bundle signature
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          for app in apps/desktop/src-tauri/target/*/release/bundle/macos/*.app apps/desktop/src-tauri/target/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      # ---------- Windows: portable zip, signatures, provenance ----------

      # The bundler signs (and patches the bundle type into) the copy of the
      # app it packs into each installer, then restores the original unsigned
      # binary in target/release. That original is what the portable zip
      # ships, so it is signed here with the same certificate and settings.
      - name: Sign portable executable
        if: matrix.platform == 'Windows' && env.WINDOWS_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -as [version] } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $exe = "apps/desktop/src-tauri/target/release/deeix-chat-desktop.exe"
          & $signtool.FullName sign /fd $conf.bundle.windows.digestAlgorithm /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT `
            /t $conf.bundle.windows.timestampUrl /d "DEEIX Chat" $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }

      # Optional offline variant: Microsoft's WebView2 Fixed Version runtime,
      # checked for Microsoft's Authenticode signature (and a pinned hash when
      # configured) before it is expanded into the package.
      - name: Fetch WebView2 Fixed Version runtime
        id: webview2
        if: matrix.platform == 'Windows' && vars.WEBVIEW2_FIXED_RUNTIME_URL != ''
        shell: pwsh
        env:
          WEBVIEW2_URL: ${{ vars.WEBVIEW2_FIXED_RUNTIME_URL }}
          WEBVIEW2_SHA256: ${{ vars.WEBVIEW2_FIXED_RUNTIME_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cab = Join-Path $env:RUNNER_TEMP "webview2-fixed.cab"
          $dir = Join-Path $env:RUNNER_TEMP "webview2-fixed"
          Invoke-WebRequest -Uri $env:WEBVIEW2_URL -OutFile $cab -UseBasicParsing
          $hash = (Get-FileHash $cab -Algorithm SHA256).Hash
          Write-Host "WebView2 runtime .cab SHA-256: $hash"
          if ($env:WEBVIEW2_SHA256 -and $hash -ne $env:WEBVIEW2_SHA256.ToUpper()) {
            throw "WebView2 runtime hash mismatch: expected $($env:WEBVIEW2_SHA256), got $hash"
          }
          $sig = Get-AuthenticodeSignature $cab
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "WebView2 runtime .cab is not validly signed by Microsoft: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          expand.exe $cab -F:* $dir | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "expand failed with $LASTEXITCODE" }
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package portable
        id: portable
        if: matrix.platform == 'Windows'
        shell: bash
        env:
          WEBVIEW2_DIR: ${{ steps.webview2.outputs.dir }}
        run: |
          set -euo pipefail
          out=apps/desktop/src-tauri/target/release/bundle/portable
          rm -rf "$out"
          node apps/desktop/scripts/package-portable.mjs --out-dir "$out"
          if [[ -n "$WEBVIEW2_DIR" ]]; then
            node apps/desktop/scripts/package-portable.mjs --out-dir "$out" --webview2 "$WEBVIEW2_DIR"
          fi
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # With a certificate every shipped Windows binary must carry a valid
      # signature; without one, report what is unsigned.
      - name: Verify Windows signatures
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "apps/desktop/src-tauri"
          $files = @(
            "$root/target/release/deeix-chat-desktop.exe"
            "$root/binaries/deeix-chat-server-x86_64-pc-windows-msvc.exe"
          )
          $files += Get-ChildItem "$root/target/release/bundle/nsis/*-setup.exe", "$root/target/release/bundle/msi/*.msi" |
            ForEach-Object FullName
          $required = [bool]$env:WINDOWS_CERTIFICATE_THUMBPRINT
          $failed = $false
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            $line = "$($sig.Status): $file ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -eq 'Valid') {
              Write-Host $line
            } elseif ($required) {
              Write-Host "::error::$line"
              $failed = $true
            } else {
              Write-Host "::warning::$line"
            }
          }
          if ($failed) { exit 1 }

      - name: Attest Windows build provenance
        if: matrix.platform == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip

      # Uploaded under their final names; the assets job leaves them alone.
      - name: Upload portable packages to the release
        if: matrix.platform == 'Windows' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.portable.outputs.dir }}"/*.zip --clobber --repo "${{ github.repository }}"

      - name: Upload bundles as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/portable/*.zip
          if-no-files-found: warn

  assets:
    name: Rename release assets
    # Tauri's asset names do not say which platform a file belongs to. Runs
    # once every leg has uploaded; the updater manifest references assets by
    # file name and is rewritten to match. SHA256SUMS is then written over
    # the final names.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rename
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node apps/desktop/scripts/rename-release-assets.mjs "${{ github.ref_name }}"
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node apps/desktop/scripts/release-checksums.mjs "${{ github.ref_name }}"

  channel:
    name: Refresh beta manifest
    # A release created from the Releases page is already published when the
    # tag arrives, so Desktop Channel ran before latest.json existed. Now that
    # every leg has uploaded and the assets carry their final names, point the
    # beta channel at it if applicable.
    needs: [build, assets]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash apps/desktop/scripts/refresh-beta-manifest.sh "${{ github.ref_name }}"
