name: Desktop Release

# Coordinate shared inputs, native builds and publication. Release runs live
# on the default branch so successive tags can reuse caches; every build still
# checks out the immutable commit resolved from release_tag.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release; leave empty for workflow artifacts only"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch release on the default branch
    if: github.ref_type == 'tag' || (inputs.release_tag != '' && github.ref_name != github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh workflow run desktop-release.yml --ref "$DEFAULT_BRANCH" -f release_tag="$RELEASE_TAG"
          echo "Release $RELEASE_TAG dispatched on $DEFAULT_BRANCH for shared caches." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Prepare shared inputs
    if: github.ref_type != 'tag' && (inputs.release_tag == '' || github.ref_name == github.event.repository.default_branch)
    uses: ./.github/workflows/desktop-prepare.yml
    with:
      release-tag: ${{ inputs.release_tag || '' }}

  macos-arm64:
    name: macOS arm64
    needs: prepare
    uses: ./.github/workflows/desktop-macos.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
      arch: arm64
    secrets: inherit

  macos-x64:
    name: macOS x64
    needs: prepare
    uses: ./.github/workflows/desktop-macos.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
      arch: x64
    secrets: inherit

  linux-x64:
    name: Linux x64
    needs: prepare
    uses: ./.github/workflows/desktop-linux.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
    secrets: inherit

  windows-x64:
    name: Windows x64
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop-windows.yml
    with:
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      channel: ${{ needs.prepare.outputs.channel }}
    secrets: inherit

  publish:
    name: Assemble draft release
    needs: [prepare, macos-arm64, macos-x64, linux-x64, windows-x64]
    if: needs.prepare.outputs.release-tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: release-assets
          merge-multiple: true
      # One writer creates the draft, latest.json and SHA256SUMS only after all
      # four targets pass verification. Publishing the draft remains a human step.
      - name: Upload assets and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
        run: node apps/desktop/scripts/publish-desktop-release.mjs --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" --dir release-assets
      - name: Refresh beta manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: bash apps/desktop/scripts/refresh-beta-manifest.sh "$RELEASE_TAG"
