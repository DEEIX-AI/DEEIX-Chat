name: deeix-chat

services:
  app:
    image: ${DEEIX_CHAT_IMAGE:-ghcr.io/deeix-ai/deeix-chat:latest}
    container_name: deeix-chat-app
    ports:
      # Optional. Localhost-only by default. Put a reverse proxy in front for public access.
      - "127.0.0.1:8080:8080"
    volumes:
      - app_storage:/app/storage
      - app_data:/app/data
      # The image runs from /app and reads /app/config.yaml automatically.
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deeix-chat

  # Optional built-in MCP server for DeepSeek Search & Fetch.
  # Enable with: docker compose --profile deepseek-search up -d
  # Then add http://deeix-chat-deepseek-search:8080/mcp in Admin -> Tools.
  deepseek-search:
    image: ${DEEIX_DEEPSEEK_SEARCH_IMAGE:-deeix-deepseek-search:latest}
    container_name: deeix-chat-deepseek-search
    profiles: ["deepseek-search"]
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MCP_AUTH_TOKEN: ${DEEIX_DEEPSEEK_SEARCH_TOKEN:-}
    networks:
      - deeix-chat

volumes:
  app_storage:
    name: deeix-chat-app-storage
  app_data:
    name: deeix-chat-app-data

networks:
  deeix-chat:
    name: deeix-chat-network
