# Optional overlay. Stack on the default or SQLite root profile:
#   docker compose -f docker-compose.yml -f docker-compose.vocechat.yml up -d
#   docker compose -f docker-compose.sqlite.yml -f docker-compose.vocechat.yml up -d
# The full profile already includes this service and does not need the overlay.
# VoceChat has no host port. Only the DEEIX backend can reach it on this network.
services:
  app:
    depends_on:
      vocechat:
        condition: service_healthy
      vocechat-init:
        condition: service_completed_successfully
    environment:
      INTERNAL_MESSAGING_ENABLED: "true"
      INTERNAL_MESSAGING_VOCECHAT_URL: "http://vocechat:3000"
      INTERNAL_MESSAGING_SECRET_FILE: "/run/secrets/vocechat/third-party-secret"
    volumes:
      - vocechat_secrets:/run/secrets/vocechat:ro

  vocechat:
    # v0.5.32 is the version validated by the DEEIX VoceChat integration.
    image: privoce/vocechat-server:v0.5.32
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - vocechat_data:/home/vocechat-server/data
      - ./docker/vocechat/config.toml:/home/vocechat-server/config/config.toml:ro
    command:
      - --network.bind
      - 0.0.0.0:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - deeix-chat

  vocechat-init:
    image: python:3.13.7-alpine3.22
    restart: "no"
    depends_on:
      vocechat:
        condition: service_healthy
    entrypoint:
      - python3
      - /opt/deeix/vocechat-init.py
    environment:
      VOCECHAT_URL: "http://vocechat:3000"
      VOCECHAT_SECRET_PATH: "/run/secrets/vocechat/third-party-secret"
      VOCECHAT_CREDENTIAL_PATH: "/var/lib/deeix-vocechat-init/administrator.json"
    volumes:
      - ./docker/vocechat/init.py:/opt/deeix/vocechat-init.py:ro
      - vocechat_secrets:/run/secrets/vocechat
      - vocechat_init_state:/var/lib/deeix-vocechat-init
    networks:
      - deeix-chat

volumes:
  vocechat_data:
    name: deeix-chat-vocechat-data
  vocechat_secrets:
    name: deeix-chat-vocechat-secrets
  vocechat_init_state:
    name: deeix-chat-vocechat-init-state
